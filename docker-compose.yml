services:
  postgres:
    restart: always
    image: postgres:17-bookworm
    hostname: postgres
    container_name: postgres
    user: postgres
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres:/home/postgres/pgdata/
    networks:
      - internal
    environment:
      - POSTGRES_DB=rekono
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    security_opt:
      - no-new-privileges:true
  
  valkey:
    restart: always
    image: valkey/valkey:8-bookworm
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    hostname: valkey
    container_name: valkey
    expose:
      - 6379
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  initializer:
    restart: 'no'
    image: pablosnt/rekono-worker:unstable
    command: bash /entrypoints/initializer.sh
    container_name: initializer
    volumes:
      - rekono:/rekono
      - ./config.yaml:/rekono/config.yaml:ro
      - wordlists_seclists:/usr/share/seclists
      - wordlists_dirb:/usr/share/dirb/wordlists
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - RKN_DB_HOST=postgres
      - RKN_DB_USER=postgres
      - RKN_DB_PASSWORD=postgres
      - DJANGO_SUPERUSER_EMAIL=${RKN_EMAIL:-rekono@rekono.com}
      - DJANGO_SUPERUSER_USERNAME=${RKN_USERNAME:-rekono}
      - DJANGO_SUPERUSER_PASSWORD=${RKN_PASSWORD:-rekono}
  
  tasks-worker:
    restart: always
    image: pablosnt/rekono-backend:unstable
    command: uv run --no-dev manage.py rqworker tasks --with-scheduler
    hostname: tasks-worker
    volumes:
      - rekono:/rekono
      - ./config.yaml:/rekono/config.yaml:ro
      - wordlists_seclists:/usr/share/seclists
      - wordlists_dirb:/usr/share/dirb/wordlists
    networks:
      - internal
      - external
    depends_on:
      valkey:
        condition: service_healthy
      initializer:
        condition: service_completed_successfully
    environment:
      - RKN_DB_HOST=postgres
      - RKN_DB_USER=postgres
      - RKN_DB_PASSWORD=postgres
      - RKN_RQ_HOST=valkey
    security_opt:
      - no-new-privileges:true

  executions-worker:
    restart: always
    image: pablosnt/rekono-worker:unstable
    command: bash /entrypoints/executions-worker.sh
    hostname: executions-worker
    volumes:
      - rekono:/rekono
      - ./config.yaml:/rekono/config.yaml:ro
    networks:
      - internal
      - external
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    depends_on:
      valkey:
        condition: service_healthy
      initializer:
        condition: service_completed_successfully
    environment:
      - RKN_DB_HOST=postgres
      - RKN_DB_USER=postgres
      - RKN_DB_PASSWORD=postgres
      - RKN_RQ_HOST=valkey

  findings-worker:
    restart: always
    image: pablosnt/rekono-backend:unstable
    command: uv run --no-dev manage.py rqworker findings
    hostname: findings-worker
    volumes:
      - rekono:/rekono
      - ./config.yaml:/rekono/config.yaml:ro
    networks:
      - internal
      - external
    depends_on:
      valkey:
        condition: service_healthy
      initializer:
        condition: service_completed_successfully
    environment:
      - RKN_DB_HOST=postgres
      - RKN_DB_USER=postgres
      - RKN_DB_PASSWORD=postgres
      - RKN_RQ_HOST=valkey
    security_opt:
      - no-new-privileges:true

  monitor-worker:
    restart: always
    image: pablosnt/rekono-backend:unstable
    command: uv run --no-dev manage.py rqworker monitor --with-scheduler
    hostname: monitor-worker
    volumes:
      - rekono:/rekono
      - ./config.yaml:/rekono/config.yaml:ro
    networks:
      - internal
      - external
    depends_on:
      valkey:
        condition: service_healthy
      initializer:
        condition: service_completed_successfully
    environment:
      - RKN_DB_HOST=postgres
      - RKN_DB_USER=postgres
      - RKN_DB_PASSWORD=postgres
      - RKN_RQ_HOST=valkey
    security_opt:
      - no-new-privileges:true

  telegram-bot:
    restart: always
    image: pablosnt/rekono-backend:unstable
    command: uv run --no-dev manage.py telegram_bot
    hostname: telegram_bot
    container_name: telegram-bot
    volumes:
      - rekono:/rekono
      - ./config.yaml:/rekono/config.yaml:ro
    networks:
      - internal
      - external
    depends_on:
      valkey:
        condition: service_healthy
      initializer:
        condition: service_completed_successfully
    environment:
      - RKN_DB_HOST=postgres
      - RKN_DB_USER=postgres
      - RKN_DB_PASSWORD=postgres
      - RKN_RQ_HOST=valkey
    security_opt:
      - no-new-privileges:true

  backend:
    restart: always
    image: pablosnt/rekono-backend:unstable
    command: uv run --no-dev manage.py runserver 0.0.0.0:8000
    hostname: backend
    container_name: backend
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import requests; requests.get('http://localhost:8000/api/schema/swagger-ui/', timeout=5).raise_for_status()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    expose:
      - 8000
    volumes:
      - rekono:/rekono
      - ./config.yaml:/rekono/config.yaml:ro
    networks:
      - internal
      - external
    depends_on:
      valkey:
        condition: service_healthy
      initializer:
        condition: service_completed_successfully
    environment:
      - RKN_DB_HOST=postgres
      - RKN_DB_USER=postgres
      - RKN_DB_PASSWORD=postgres
      - RKN_RQ_HOST=valkey
      - RKN_TRUSTED_PROXY=true
      - RKN_ALLOWED_HOSTS=*
    security_opt:
      - no-new-privileges:true
  
  frontend:
    restart: always
    image: pablosnt/rekono-frontend:unstable
    hostname: frontend
    container_name: frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - 3000
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  nginx:
    restart: always
    image: pablosnt/rekono-nginx:unstable
    hostname: nginx
    container_name: nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - nginx:/etc/nginx/tls/
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - internal
      - external
    security_opt:
      - no-new-privileges:true

volumes:
  postgres:
  nginx:
  rekono:
  wordlists_seclists:
  wordlists_dirb:

networks:
  internal:
    internal: true
  external:
