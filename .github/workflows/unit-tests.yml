name: Unit tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'

env:
  REQUIRED_COVERAGE: 95

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      
      - name: Install and start Valkey server
        run: |
          sudo apt update -y
          sudo apt install valkey-server -y
          sudo systemctl start valkey-server

      - name: Install UV
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          activate-environment: true
      
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run unit tests
        working-directory: backend
        run: uv run coverage run --concurrency=multiprocessing,thread manage.py test --parallel 50
      
      - name: Check coverage
        working-directory: backend
        run: |
          uv run coverage combine
          uv run coverage report -m --skip-covered --fail-under=$REQUIRED_COVERAGE
