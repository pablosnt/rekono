name: Unit tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'

env:
  REQUIRED_COVERAGE: 95

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      
      - name: Install and start Valkey server
        run: |
          sudo apt update -y
          sudo apt install valkey-server -y
          sudo systemctl start valkey-server

      - name: Install UV
        uses: astral-sh/setup-uv@ca5ddd015e07666cb1f1340ad6171f5e7afffb3e
        with:
          activate-environment: true
      
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run unit tests
        working-directory: backend
        run: uv run coverage run --concurrency=multiprocessing,thread manage.py test --parallel 50
      
      - name: Check coverage
        working-directory: backend
        run: |
          uv run coverage combine
          uv run coverage report -m --skip-covered --omit="tests/*,platforms/telegram_app/bot/*,platforms/telegram_app/framework.py,platforms/**/notifications.py" --fail-under=$REQUIRED_COVERAGE
