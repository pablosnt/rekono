name: Code style
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check changed files
        uses: dorny/paths-filter@f3ceefdc7ef57bc2d8560787d4b6c33e44044cec
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'

      - name: Checkout
        if: ${{ steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install UV
        if: ${{ steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
        uses: astral-sh/setup-uv@ca5ddd015e07666cb1f1340ad6171f5e7afffb3e
        with:
          activate-environment: true
          python-version: 3.12.0 # Required by pytype

      - name: Install dependencies
        working-directory: backend
        if: ${{ steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
        run: uv sync --locked

      - name: Ruff
        if: ${{ steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
        working-directory: backend
        run: |
          uvx ruff format --check
          uvx ruff check

      - name: Flake8
        if: ${{ (steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        working-directory: backend
        run: uvx flake8 .

      - name: PyType
        if: ${{ (steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        working-directory: backend
        run: uvx pytype --disable "import-error,pyi-error,invalid-annotation" --keep-going --jobs 100 .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check changed files
        uses: dorny/paths-filter@f3ceefdc7ef57bc2d8560787d4b6c33e44044cec
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'

      - name: Checkout
        if: ${{ steps.changes.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      
      - name: Install Node
        uses: actions/setup-node@f4a67bbeca970f103397d3d2b9462cf787cd2980
        with:
          node-version: 22

      - name: Install PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10

      - name: Install Node dependencies
        if: ${{ steps.changes.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
        working-directory: frontend/
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm nuxt prepare

      - name: ESLint
        if: ${{ steps.changes.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
        working-directory: frontend/
        run: pnpm run eslint

      - name: Prettier
        if: ${{ (steps.changes.outputs.frontend == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        working-directory: frontend/
        run: pnpm run prettier

  email-templates:
    name: Email Templates
    runs-on: ubuntu-latest
    steps:
      - name: Check changed files
        uses: dorny/paths-filter@f3ceefdc7ef57bc2d8560787d4b6c33e44044cec
        id: changes
        with:
          filters: |
            templates:
              - 'email-templates/**'

      - name: Checkout
        if: ${{ steps.changes.outputs.templates == 'true' || github.event_name != 'pull_request' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      
      - name: Install Node
        uses: actions/setup-node@f4a67bbeca970f103397d3d2b9462cf787cd2980
        with:
          node-version: 22

      - name: Install PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10

      - name: Install Node dependencies
        if: ${{ steps.changes.outputs.templates == 'true' || github.event_name != 'pull_request' }}
        working-directory: email-templates/
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: ESLint
        if: ${{ steps.changes.outputs.templates == 'true' || github.event_name != 'pull_request' }}
        working-directory: email-templates/
        run: pnpm run eslint

      - name: Prettier
        if: ${{ (steps.changes.outputs.templates == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        working-directory: email-templates/
        run: pnpm run prettier