name: Code style
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check changed files
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'

      - name: Checkout
        if: ${{ steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install UV
        if: ${{ steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
        uses: astral-sh/setup-uv@cb84d12dc6a0d495b82fcae14fa4559b90698660
        with:
          activate-environment: true
          python-version: 3.12.0 # Required by pytype

      - name: Install dependencies
        working-directory: backend
        if: ${{ steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
        run: uv sync --locked

      - name: Ruff
        if: ${{ steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
        working-directory: backend
        run: |
          uvx ruff format --check
          uvx ruff check

      - name: Flake8
        if: ${{ (steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        working-directory: backend
        run: uvx flake8 .

      - name: PyType
        if: ${{ (steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        working-directory: backend
        run: uvx pytype --disable "import-error,pyi-error,invalid-annotation" --keep-going --jobs 100 .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check changed files
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'

      - name: Checkout
        if: ${{ steps.changes.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      
      - name: Install Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22

      - name: Install PNPM
        uses: pnpm/action-setup@6e7bdbda5fe05107efc88b23b7ed00aa05f84ca0
        with:
          version: 10

      - name: Install Node dependencies
        if: ${{ steps.changes.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
        working-directory: frontend/
        run: |
          pnpm install . --ignore-scripts
          pnpm nuxt prepare

      - name: ESLint
        if: ${{ steps.changes.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
        working-directory: frontend/
        run: pnpm run eslint

      - name: Prettier
        if: ${{ (steps.changes.outputs.frontend == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        working-directory: frontend/
        run: pnpm run prettier

  email-templates:
    name: Email Templates
    runs-on: ubuntu-latest
    steps:
      - name: Check changed files
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: changes
        with:
          filters: |
            templates:
              - 'email-templates/**'

      - name: Checkout
        if: ${{ steps.changes.outputs.templates == 'true' || github.event_name != 'pull_request' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      
      - name: Install Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22

      - name: Install PNPM
        uses: pnpm/action-setup@6e7bdbda5fe05107efc88b23b7ed00aa05f84ca0
        with:
          version: 10

      - name: Install Node dependencies
        if: ${{ steps.changes.outputs.templates == 'true' || github.event_name != 'pull_request' }}
        working-directory: email-templates/
        run: pnpm install . --ignore-scripts

      - name: ESLint
        if: ${{ steps.changes.outputs.templates == 'true' || github.event_name != 'pull_request' }}
        working-directory: email-templates/
        run: pnpm run eslint

      - name: Prettier
        if: ${{ (steps.changes.outputs.templates == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        working-directory: email-templates/
        run: pnpm run prettier