name: Code style
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit

      - name: Check changed files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'

      - name: Checkout
        if: ${{ steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install UV
        if: ${{ steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          activate-environment: true
          python-version: 3.12.0 # Required by pytype

      - name: Install dependencies
        working-directory: backend
        if: ${{ steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
        run: uv sync --locked

      - name: Ruff
        if: ${{ steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
        working-directory: backend
        run: |
          uvx ruff format --check
          uvx ruff==0.15.22 check
          uvx ruff check --select I

      - name: Flake8
        if: ${{ (steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        working-directory: backend
        run: uvx flake8 .

      - name: PyType
        if: ${{ (steps.changes.outputs.backend == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        working-directory: backend
        run: uvx pytype --disable "import-error,pyi-error,invalid-annotation" --exclude "**/migrations/*.py" --keep-going --jobs 100 .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit

      - name: Check changed files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'

      - name: Checkout
        if: ${{ steps.changes.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Install PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12

      - name: Install Node dependencies
        if: ${{ steps.changes.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
        working-directory: frontend/
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm nuxt prepare

      - name: ESLint
        if: ${{ steps.changes.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
        working-directory: frontend/
        run: pnpm run eslint

      - name: Prettier
        if: ${{ (steps.changes.outputs.frontend == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        working-directory: frontend/
        run: pnpm run prettier

  email-templates:
    name: Email Templates
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit

      - name: Check changed files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: changes
        with:
          filters: |
            templates:
              - 'email-templates/**'

      - name: Checkout
        if: ${{ steps.changes.outputs.templates == 'true' || github.event_name != 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Install PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12

      - name: Install Node dependencies
        if: ${{ steps.changes.outputs.templates == 'true' || github.event_name != 'pull_request' }}
        working-directory: email-templates/
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: ESLint
        if: ${{ steps.changes.outputs.templates == 'true' || github.event_name != 'pull_request' }}
        working-directory: email-templates/
        run: pnpm run eslint

      - name: Prettier
        if: ${{ (steps.changes.outputs.templates == 'true' || github.event_name != 'pull_request') && !cancelled() }}
        working-directory: email-templates/
        run: pnpm run prettier