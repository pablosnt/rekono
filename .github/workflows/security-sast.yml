name: SAST
on:
  workflow_dispatch:
  pull_request:

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      
      - name: Semgrep
        run: semgrep scan --config=auto --error --json -o semgrep.json .
      
      - name: Upload report as GitHub artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Semgrep
          path: semgrep.json
          if-no-files-found: warn

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required to upload SARIF files
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@a687b25bf3aa149153e80ed5f45292e47589888c
