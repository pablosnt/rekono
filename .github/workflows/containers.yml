name: Containers
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
  release:
    types: [published]

permissions: {}

env:
  DOCKER_USER: pablosnt

jobs:
  docker-images:
    runs-on: ubuntu-latest
    environment: docker-hub
    permissions:
      contents: read
      id-token: write       # OIDC token is used to request a Sigstore signing certificate
      attestations: write   # Persist the generated attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Backend
            dockerfile: docker/Dockerfile
            image: rekono-backend
            target: backend
            sbom: true
          - name: Frontend
            dockerfile: docker/Dockerfile
            image: rekono-frontend
            target: frontend
            sbom: true
          - name: Nginx
            dockerfile: docker/nginx/Dockerfile
            image: rekono-nginx
            target: null
            sbom: true
          - name: Worker
            dockerfile: docker/Dockerfile
            image: rekono-worker
            target: worker
            sbom: false
            # Docker image is very large and we need some extra GB to complete the build
            clean-disk: true
    name: ${{ matrix.name }}
    defaults:
      run:
        shell: bash
        working-directory: /mnt
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit

      - name: Free disk space
        if: ${{ matrix.clean-disk == true }}
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          preinstalled-runtimes: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
          logout: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Get metadata
        id: metadata
        working-directory: backend/rekono
        run: |
          REKONO_VERSION=$(grep -oP '^VERSION = "\K[^"]+' settings.py | head -1)
          echo "version=$REKONO_VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date --rfc-3339=seconds)" >> "$GITHUB_OUTPUT"

      - name: Build and push unstable
        id: build-unstable
        if: ${{ github.event_name != 'release' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.DOCKER_USER }}/${{ matrix.image }}:unstable
          load: true
          push: true
          sbom: ${{ matrix.sbom }}
          provenance: true
          build-args: |
            LABEL_CREATED=${{ steps.metadata.outputs.date }}
            LABEL_VERSION=${{ steps.metadata.outputs.version }}-dev
            LABEL_REVISION=${{ github.sha }}

      - name: Build and push release
        id: build-release
        if: ${{ github.event_name == 'release' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.DOCKER_USER }}/${{ matrix.image }}:${{ github.event.release.name }},${{ env.DOCKER_USER }}/${{ matrix.image }}:latest,${{ env.DOCKER_USER }}/${{ matrix.image }}:unstable
          load: true
          push: true
          sbom: ${{ matrix.sbom }}
          provenance: true
          build-args: |
            LABEL_CREATED=${{ steps.metadata.outputs.date }}
            LABEL_VERSION=${{ github.event.release.name }}
            LABEL_REVISION=${{ github.sha }}

      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: docker.io/${{ env.DOCKER_USER }}/${{ matrix.image }}
          subject-digest: ${{ github.event_name == 'release' && steps.build-release.outputs.digest || steps.build-unstable.outputs.digest }}
          push-to-registry: false

  trivy:
    name: Trivy (${{ matrix.name }})
    if: ${{ github.event_name != 'release' }}
    needs: docker-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Backend
            image: rekono-backend
          - name: Frontend
            image: rekono-frontend
          - name: Nginx
            image: rekono-nginx
          - name: Worker
            image: rekono-worker
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: docker.io/${{ env.DOCKER_USER }}/${{ matrix.image }}:unstable
          scanners: vuln
          format: json
          output: ${{ matrix.name }}-trivy.json
          exit-code: 1
          ignore-unfixed: true
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.name }}-trivy
          path: ${{ matrix.name }}-trivy.json
          if-no-files-found: warn

  dockle:
    name: Dockle (${{ matrix.name }})
    if: ${{ github.event_name != 'release' }}
    needs: docker-images
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Backend
            image: rekono-backend
            ignore: CIS-DI-0010
          - name: Frontend
            image: rekono-frontend
            ignore: CIS-DI-0010
          - name: Nginx
            image: rekono-nginx
            ignore: CIS-DI-0010
          - name: Worker
            image: rekono-worker
            # DKL-DI-0001: sudo required for runtime tool updates (nuclei/searchsploit) as non-root user
            ignore: CIS-DI-0010,DKL-DI-0001
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit

      - name: Dockle
        uses: goodwithtech/dockle-action@e30e6af832aad6ea7dca2a248d31a85eab6dbd68
        with:
          image: docker.io/${{ env.DOCKER_USER }}/${{ matrix.image }}:unstable
          format: json
          output: ${{ matrix.name }}-dockle.json
          exit-code: 1
          exit-level: warn
          # CIS-DI-0010: Flags some environment variables of the Dockerfile or the config.yaml due to having suspicious values that look like secrets
          ignore: ${{ matrix.ignore }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.name }}-dockle
          path: ${{ matrix.name }}-dockle.json
          if-no-files-found: warn
