[project]
name = "rekono"
version = "2.0.0"
description = "Pentesting automation platform that combines hacking tools to complete security assessments"
readme = "../../README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "certifi==2025.8.3",
    "cvss==3.6",
    "cryptography==46.0.1",
    "defusedxml==0.7.1",
    "django==5.2.6",
    "django-filter==25.1",
    "django-rq==3.1",
    "django-taggit==6.1.0",
    "djangorestframework==3.16.1",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.28.0",
    "geocoder==1.38.1",
    "psycopg[binary,pool]==3.2.10",
    "pycryptodome==3.23.0",
    "pyjwt==2.10.1",
    "pyotp==2.9.0",
    "python-libnmap==0.7.3",
    "python-magic==0.4.27",
    "python-telegram-bot[job-queue]==22.4",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "rq==2.6.0",
    "stringcase==1.2.0",
    "tornado==6.5.2",
    "xhtml2pdf==0.2.17",
    "beautifulsoup4>=4.14.3",
    "markdown>=3.10.2",
]

[dependency-groups]
dev = [
    "coverage>=7.10.0",
    "tblib>=3.1.0",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.coverage.run]
concurrency = ["multiprocessing", "thread"]
