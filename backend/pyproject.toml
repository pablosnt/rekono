[project]
name = "rekono"
version = "2.0.0"
description = "Pentesting automation platform that combines hacking tools to complete security assessments"
readme = "../../README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "beautifulsoup4==4.15.0",
    "certifi==2026.7.22",
    "cvss==3.6",
    "cryptography==50.0.0",
    "defusedxml==0.7.1",
    "django==5.2.17",
    "django-filter==26.1",
    "django-rq==4.1.1",
    "django-taggit==6.1.0",
    "djangorestframework==3.18.0",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.30.0",
    "geocoder==1.38.1",
    "gunicorn>=26.0.0",
    "markdown==3.10.3",
    "psycopg[binary,pool]==3.3.4",
    "pycryptodome==3.23.0",
    "pyjwt==2.13.0",
    "pyotp==2.10.0",
    "python-libnmap==0.7.3",
    "python-magic==0.4.27",
    "python-telegram-bot[job-queue]==22.8",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "rq==2.10.0",
    "stringcase==1.2.0",
    "tornado==6.5.8",
    "xhtml2pdf==0.2.17",
]

[dependency-groups]
dev = [
    "coverage==7.15.2",
    "tblib==3.2.2",
]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
    # Force a non-vulnerable version of a transitive dependency pulled by xhtml2pdf
    "pillow>=12.3.0",
]

[tool.ruff]
exclude = ["migrations", ".venv"]
line-length = 120
indent-width = 4

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.coverage.run]
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
omit = [
    "tests/*",
    "*/migrations/*",
    "platforms/telegram_app/bot/*",
    "platforms/telegram_app/framework.py",
    "platforms/**/notifications.py",
]
