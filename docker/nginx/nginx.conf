pid /run/nginx.pid;
worker_processes auto;
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    client_max_body_size 50m;
    
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
    limit_req_zone $binary_remote_addr zone=backend_requests_per_ip:10m rate=1000r/s;
    limit_req_zone $binary_remote_addr zone=frontend_requests_per_ip:10m rate=1000r/s;
    limit_conn_status 429;
    limit_req_status 429;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        listen [::]:80;

        server_name localhost;

        limit_conn connections_per_ip 200;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;

        server_name localhost;

        limit_conn connections_per_ip 200;
        
        http2 on;
        http2_max_concurrent_streams 128;        

        ssl_certificate /etc/nginx/tls/certificate.crt;
        ssl_certificate_key /etc/nginx/tls/privatekey.key;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

        location /api/_nuxt_icon/ {
            limit_req zone=frontend_requests_per_ip burst=1000 nodelay;
            
            proxy_redirect off;

            proxy_pass http://frontend;
        }

        location /api/ {
            limit_req zone=backend_requests_per_ip burst=1000 nodelay;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_buffering off;
            proxy_redirect off;

            proxy_pass_header Cache-Control;
            proxy_pass_header Content-Security-Policy;
            proxy_pass_header Referrer-Policy;
            proxy_pass_header Server;
            proxy_pass_header X-Content-Type-Options;
            proxy_pass_header X-Frame-Options;

            proxy_pass http://backend;

            location /api/notes/ {
                client_max_body_size 300m;
                proxy_request_buffering off;

                proxy_pass http://backend;
            }

            location /api/wordlists/ {
                client_max_body_size 1g;
                proxy_request_buffering off;

                proxy_pass http://backend;
            }
        }

        location / {
            limit_req zone=frontend_requests_per_ip burst=1000 nodelay;

            proxy_redirect off;

            proxy_pass_header Server;
            proxy_pass_header Cache-Control;

            add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' gateway.umami.is api.iconify.design; img-src 'self' data: www.kali.org fullhunt.io avatars.githubusercontent.com gitleaks.io owasp.org vulncheck.com www.first.org osv.dev euvd.enisa.europa.eu github.com www.virustotal.com cvecrowd.com hacktricks.wiki nvd.nist.gov defectdojo.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' cloud.umami.is; style-src 'self' 'unsafe-inline'; font-src 'self'; report-uri /api/csp-report-uri/; report-to csp-endpoint";
            add_header Reporting-Endpoints 'csp-endpoint="/api/csp-report-to/"';
            add_header Referrer-Policy no-referrer;
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;

            proxy_pass http://frontend;
        }
    }
}